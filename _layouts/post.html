---
layout: default
---
<article class="shell article">
  <a class="back-link" href="{{ '/' | relative_url }}">← Back to home</a>
  <p class="eyebrow">{{ page.category | default: 'Journal' | replace: '-', ' ' }}</p>
  <h1>{{ page.title | escape }}</h1>
  <p class="post-meta">By Lydia Rim · {{ page.date | date: '%B %-d, %Y' }}</p>
  <div class="prose">{{ content }}</div>
</article>
