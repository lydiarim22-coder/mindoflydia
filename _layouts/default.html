<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="{{ page.description | default: site.description | escape }}">
    <title>{% if page.title %}{{ page.title | escape }} · {% endif %}{{ site.title | escape }}</title>
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-QHQF5V1R4L"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-QHQF5V1R4L');
    </script>
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <header class="site-header">
      <div class="shell header-inner">
        <a class="brand" href="{{ '/' | relative_url }}" aria-label="Mind of Lydia home">Mind <em>of</em> Lydia</a>
        <nav aria-label="Main navigation">
          <a href="{{ '/motherhood/' | relative_url }}">Motherhood</a>
          <a href="{{ '/education/' | relative_url }}">Education</a>
          <a href="{{ '/the-lydia-rating/' | relative_url }}">The Lydia Rating</a>
          <a href="{{ '/about/' | relative_url }}">About</a>
          <a href="{{ '/contact/' | relative_url }}">Contact</a>
        </nav>
      </div>
    </header>
    <main id="main">{{ content }}</main>
    <footer class="site-footer">
      <div class="shell footer-inner">
        <p>© {{ site.time | date: '%Y' }} Mind of Lydia</p>
        <p>Real life. Honest motherhood. Inspired living.</p>
      </div>
    </footer>
  </body>
</html>
