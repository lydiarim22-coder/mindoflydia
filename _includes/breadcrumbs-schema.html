{% if page.layout == 'post' %}
{% assign section_url = '/' | append: page.category | append: '/' %}
{% assign section_page = site.pages | where: 'url', section_url | first %}
{% assign section_name = section_page.title | default: page.category %}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "BreadcrumbList",
  "itemListElement": [
    {"@type": "ListItem", "position": 1, "name": "Home", "item": {{ '/' | absolute_url | jsonify }}},
    {"@type": "ListItem", "position": 2, "name": {{ section_name | jsonify }}, "item": {{ section_url | absolute_url | jsonify }}},
    {"@type": "ListItem", "position": 3, "name": {{ page.title | jsonify }}, "item": {{ page.url | absolute_url | jsonify }}}
  ]
}
</script>
{% endif %}
