name: Deploy GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - name: Check rendered SEO and internal links
        run: python3 scripts/check_seo.py _site
      - name: Install travel map browser checks
        run: |
          python3 -m pip install playwright==1.55.0
          python3 -m playwright install --with-deps chromium
      - name: Check travel map interactions
        run: python3 scripts/check_travel_map.py
      - name: Save travel map screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: travel-map-previews
          path: _test-output/
          retention-days: 7
      - uses: actions/upload-pages-artifact@v3
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
